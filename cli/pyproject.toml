[project]
name = "rackphone"
version = "0.1.0"
description = "Control CLI for Rackphone server units (LineageOS phones used as server hardware)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "rich>=13.7",
    "uvicorn>=0.52.4",
]

[project.scripts]
rackphone = "rackphone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rackphone"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
