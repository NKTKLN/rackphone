[project]
name = "rackphone"
version = "0.1.0"
description = "Control CLI for Rackphone server units (LineageOS phones used as server hardware)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
]

[project.scripts]
rackphone = "rackphone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rackphone"]

[tool.uv]
package = true
