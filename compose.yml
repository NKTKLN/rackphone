# Rackphone containers.
#
# Written for a remote Docker context. Every path in a bind mount is resolved
# by the daemon rather than by the machine running the command, so a
# `./units:/repo/units` here would silently mount an empty directory that
# happens to exist on the other host - or fail. This file therefore uses named
# volumes and environment variables exclusively, and reads nothing from your
# working copy at run time.
#
# Which means the data has to be put into the volumes once:
#
#   docker compose cp ./units/. gateway:/repo/units/
#   docker compose cp ./gateway.toml gateway:/config/gateway.toml
#   docker compose exec -u root gateway chown -R rackphone:rackphone /repo/units
#
# The chown is not optional. `cp` keeps the owner the files had on this side,
# and the containers run as their own user, so without it `rackphone set`
# changes the phone but cannot record the change - and the next deploy
# reverts it.
#
# or, equivalently, by adopting the phone from inside the container:
#
#   docker compose exec gateway rackphone adopt lisa01
#
# Credentials come from a local .env, which Compose reads on this side and
# passes as environment - the one kind of configuration that crosses a remote
# context intact:
#
#   RACKPHONE_NTFY_URL=https://ntfy.example.com
#   RACKPHONE_NTFY_TOPIC=rackphone
#   RACKPHONE_NTFY_USER=rackphone
#   RACKPHONE_NTFY_PASSWORD=...
#   RACKPHONE_API_TOKEN=...
#
# Prometheus and Grafana are not here on purpose: both usually watch more than
# one rack, and neither needs to live beside the thing it scrapes. Point them at
# the bridge below - monitoring/ has the scrape config and the dashboards.
#
# The adb server owns the USB handle and listens on the daemon host's loopback,
# so both services share the host's network namespace to reach it. That is not
# only for adb: a screen session has adbd connect back to a port the gateway
# listens on, and call audio has the gateway connect to a port adb opened, both
# on the host's loopback. On a bridge network neither side finds the other and
# the screen socket fails its handshake with a bare 403.

name: rackphone

x-rackphone: &rackphone
  build:
    context: ./cli
  image: rackphone:0.2.0
  restart: unless-stopped
  network_mode: host

services:
  # Prometheus bridge: one scrape, one USB round-trip per unit.
  bridge:
    <<: *rackphone
    container_name: rackphone-bridge
    command: ["serve", "--host", "0.0.0.0", "--port", "9105"]
    environment:
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
      RACKPHONE_REPO: /repo
    volumes:
      - repo:/repo

  # SMS and call relay: drains the companion plugin, stores, forwards to ntfy,
  # and serves the API.
  gateway:
    <<: *rackphone
    container_name: rackphone-gateway
    # Loopback by default: the API serves message bodies, and a reverse proxy
    # is what puts it on the network, with TLS. `ports:` does not apply on the
    # host network, so a proxy anywhere but this host's own loopback needs the
    # gateway bound where it can reach it - 0.0.0.0 or one interface:
    #   RACKPHONE_GATEWAY_HOST=0.0.0.0
    # Any non-loopback bind needs the [admin] credentials, the proxy's address
    # in trusted_proxies, and a firewall rule admitting only that proxy.
    command: ["gateway", "--host", "${RACKPHONE_GATEWAY_HOST:-127.0.0.1}", "--port", "9106"]
    environment:
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
      RACKPHONE_REPO: /repo
      RACKPHONE_GATEWAY_HOST: ${RACKPHONE_GATEWAY_HOST:-127.0.0.1}
      # Absent values are a supported state: the gateway then stores events and
      # serves them without pushing anywhere.
      RACKPHONE_NTFY_URL: ${RACKPHONE_NTFY_URL:-}
      RACKPHONE_NTFY_TOPIC: ${RACKPHONE_NTFY_TOPIC:-}
      RACKPHONE_NTFY_USER: ${RACKPHONE_NTFY_USER:-}
      RACKPHONE_NTFY_PASSWORD: ${RACKPHONE_NTFY_PASSWORD:-}
      RACKPHONE_NTFY_TOKEN: ${RACKPHONE_NTFY_TOKEN:-}
      RACKPHONE_API_TOKEN: ${RACKPHONE_API_TOKEN:-}
      # Filters, the administrator and trusted proxies are not scalars an
      # environment variable can carry, so they live in a file in the volume.
      RACKPHONE_GATEWAY_CONFIG: /config/gateway.toml
    volumes:
      - repo:/repo
      - state:/state
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://$${RACKPHONE_GATEWAY_HOST:-127.0.0.1}:9106/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  # Unit files: which phones exist and what was declared for them.
  repo:
  # The event store the gateway writes; the only stateful thing here.
  state:
  # gateway.toml: the administrator, filters and trusted proxies.
  config:

