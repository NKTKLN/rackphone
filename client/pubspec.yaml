name: rackphone_client
description: >
  The operator's end of a Rackphone rack: logs in to the gateway, shows what
  arrived on each unit, and - later - puts the phone's screen on your own.
publish_to: 'none'

# Matches the module versions in modules/*/module.prop.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Streamed responses, which the event stream needs; the rest is plain requests.
  http: ^1.5.0
  # The refresh token is what a lost phone would hand over, so it lives behind
  # the Android Keystore rather than in a file this app can read on its own.
  flutter_secure_storage: ^9.2.4
  # A stream that outlives the screen needs a foreground service; Android kills
  # a plain isolate as soon as the app stops being visible, and the whole point
  # of this connection is to be there when it is not.
  flutter_foreground_task: ^8.17.0
  # Posting what arrives. The service keeps its own permanent notification; each
  # message needs one of its own.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The companion app next door takes no third-party packages at all, and that is
# right for an APK whose whole job is a dozen lines of SmsManager. It does not
# travel here: this app needs a hardware H.264 decoder, a keystore-backed store
# and a foreground service, and writing those by hand is not restraint. The rule
# instead is that a dependency has to earn its place against what it replaces.
flutter:
  uses-material-design: true
